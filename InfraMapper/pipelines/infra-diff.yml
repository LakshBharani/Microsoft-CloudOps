# Triggers on every PR that touches desired-state.json.
# Runs a diff against live Azure and posts the result as a PR comment.
# This pipeline is informational — it never modifies Azure.

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/desired-state.json

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      set -e
      RESPONSE=$(curl -s -o /tmp/diff_response.json -w "%{http_code}" -X POST \
        "$(INFRA_API_URL)/api/devops/webhook?subscriptionId=$(AZURE_SUBSCRIPTION_ID)&orgUrl=$(System.TeamFoundationCollectionUri)&project=$(System.TeamProject)&repository=$(Build.Repository.Name)&pat=$(ADO_PAT)&branch=$(System.PullRequest.TargetBranchName)&filePath=infra/desired-state.json&prId=$(System.PullRequest.PullRequestId)" \
        -H "Content-Type: application/json" \
        -d "$(cat $(Build.SourcesDirectory)/infra/desired-state.json)")

      echo "HTTP status: $RESPONSE"
      cat /tmp/diff_response.json

      if [ "$RESPONSE" != "200" ]; then
        echo "##vso[task.logissue type=warning]Diff request returned HTTP $RESPONSE"
      fi
    displayName: Run infrastructure diff and post PR comment
    env:
      INFRA_API_URL: $(INFRA_API_URL)
      AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
      ADO_PAT: $(ADO_PAT)
